[package]
name = "toro-auth"
version = "2.0.0"
edition = "2024"
description = "TORO Server の共通認証 (auth)"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
hmac = "0.13"
rand = "0.10"
# scratch イメージで動かすので、CA 証明書は OS から読まない (rustls-tls = webpki-roots を埋め込む)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
oxc = { version = "0.157", default-features = false, features = ["transformer", "semantic", "codegen"] }
