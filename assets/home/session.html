<div class="panel-box">
        <div class="panel-title">[ AUTH SESSION: ACTIVE (DISCORD SSO) ]</div>
        <div class="panel-body">
          <p><span class="term-cyan">&gt; USER NAME:</span> <span class="term-white">{{DISPLAY_NAME}} (@{{USERNAME}})</span></p>
          <p><span class="term-cyan">&gt; DISCORD ID:</span> <span class="term-white">{{ID}}</span></p>
          <p><span class="term-cyan">&gt; WIKI PERMISSION:</span> <span class="{{EDIT_CLASS}}">{{EDIT_LABEL}}</span></p>
          <p><span class="term-cyan">&gt; ASSIGNED ROLES:</span> <span class="term-white">{{ROLES}} ROLES REGISTERED</span></p>
          <div class="cmd-line" style="margin-top:12px; display:flex; gap:10px;">
            <a href="/api/auth/logout" class="term-btn term-btn-red">[ LOGOUT SESSION ]</a>
            <button class="term-btn term-btn-primary" onclick="generateToken()">[ ISSUE 90-DAY AI CONNECTOR TOKEN ]</button>
          </div>
          <div id="token-display" style="display:none; margin-top:12px; padding:8px; background:#001a00; border:1px dashed #00ff00;">
            <div style="font-size:11px; color:#ffff00; margin-bottom:4px;">&gt; GENERATED BEARER TOKEN (KEEP SECURE):</div>
            <textarea id="token-val" readonly style="width:100%; height:60px; background:#000; color:#00ff00; border:1px solid #00aa00; font-family:inherit; font-size:11px; padding:4px; box-sizing:border-box;"></textarea>
          </div>
        </div>
      </div>
