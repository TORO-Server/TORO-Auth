<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>連携を拒否しました - TORO サーバー</title>
  <link rel="icon" href="/_assets/favicon.svg?v={{V}}">
  <link rel="stylesheet" href="/_assets/auth.css?v={{V}}">
</head>
<body>
  <div class="map-bg" aria-hidden="true"></div>
  <main class="screen screen-narrow">
    <div class="win help warn">連携を拒否しました</div>
    <section class="win">
      <p>対象: {{CLIENT_NAME}}</p>
      <p>トークンは発行していません。権限も与えていません。</p>
      <p class="muted">OAuth のエラーコード: access_denied</p>
    </section>
    <nav class="win" aria-label="次の操作">
      <ul class="cmd">
        {{CLIENT_RETURN}}
        <li><a href="{{RETRY_URL}}" target="_top">もう一度やり直す</a></li>
        <li><a href="{{CONNECT_PAGE}}" target="_top">接続方法を見る</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
