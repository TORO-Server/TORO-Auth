<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI クライアントとの連携の許可 - TORO サーバー</title>
  <link rel="icon" href="/_assets/favicon.svg?v={{V}}">
  <link rel="stylesheet" href="/_assets/auth.css?v={{V}}">
</head>
<body>
  <div class="map-bg" aria-hidden="true"></div>
  <main class="screen screen-narrow">
    <div class="win help">AI クライアントが、TORO サーバーとの連携の許可を求めています。</div>

    <section class="win">
      <p>要求元: {{CLIENT_NAME}}</p>
      <p class="warn">トークンの送り先: {{REDIRECT_TARGET}}</p>
      <p class="muted">求める権限: {{SCOPE}}</p>
    </section>

    <section class="win">
      <h2>できるようになること</h2>
      <ul class="perm-list">
        <li>+ Wiki の閲覧と検索</li>
        {{WRITE_PERMISSION}}
        <li>+ Minecraft サーバーの稼働状態の確認</li>
      </ul>
    </section>

    {{USER_SECTION}}

    <footer><a href="{{CONNECT_PAGE}}" target="_top">接続方法を見る</a></footer>
  </main>
</body>
</html>
